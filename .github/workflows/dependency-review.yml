name: Dependency Review

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the build if there are vulnerabilities with severity moderate or higher
          fail-on-severity: moderate
          # Warn on license issues
          warn-only: false
          # Comment on PR with details
          comment-summary-in-pr: on-failure
